name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suyabuzz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: suyabuzz/.nvmrc
          cache: npm
          cache-dependency-path: suyabuzz/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Only the unit suite (`npm test` -> vitest.config.ts) runs in CI.
      # `npm run test:int` and `npm run test:e2e` are intentionally NOT run
      # here: both need a live database connection (integration tests call
      # getPayload() directly; e2e seeds/deletes real rows), and this
      # project has no database reachable from CI — the DATABASE_URI below
      # is a syntactically-valid placeholder used only so the build step can
      # generate types, not a real connection. Gating those two suites needs
      # a CI database strategy first (e.g. an ephemeral Postgres service
      # container, or a dedicated Neon branch for CI) — deferred to a later
      # phase, tracked in the Phase 0 final review (finding I4).
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time values only. The real database is never reachable from
          # CI; Payload needs a syntactically valid URI to generate types.
          DATABASE_URI: postgres://user:pass@localhost:5432/ci
          PAYLOAD_SECRET: ci-placeholder-secret-at-least-32-characters
          CRON_SECRET: ci-placeholder-cron-at-least-32-characters
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
